apis:
- aid: aidash:status
  name: AiDASH Status API
  description: 'The only public, unauthenticated, machine-readable API surface AiDASH
    exposes. It is the standard Atlassian Statuspage Status API v2 served from the
    AiDASH status page, returning JSON for overall status, the four platform
    components (IVMS, RIMS, ISMS, CRIS), incidents, and scheduled maintenances.
    AiDASH markets full REST APIs for its intelligence platform, but those are
    customer-gated and no contract, reference, or portal is published.'
