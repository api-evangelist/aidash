aid: aidash
name: AiDASH
description: 'AiDASH is an AI-first vertical SaaS company that uses satellite imagery
  and machine learning to run operations, maintenance, and climate-resilience programs
  for industries with geographically distributed assets — primarily electric and gas
  utilities, water companies, and landowners. Founded in 2019 by Abhishek Vinod Singh,
  Rahul Saxena, and Nitin Das and headquartered in San Jose, California with offices
  in the Washington D.C. metro area and Bengaluru, the company fuses high-resolution
  multispectral and SAR imagery from commercial satellite constellations with proprietary
  AI models. Its product line spans the Intelligent Vegetation Management System (IVMS),
  the Climate Risk Intelligence System (CRIS), the Asset Inspection and Monitoring
  System (AIMS), Wildfire Mitigation Planning Services (WMPS) and the IRIS wildfire
  planning platform, and a Biodiversity Net Gain management system (BNGAI). AiDASH
  markets REST APIs and industry-standard connectors for integrating its intelligence
  into existing utility systems, but publishes no public developer portal, API reference,
  or machine-readable contract — the API surface is customer-gated behind commercial
  engagement. In June 2026 Schneider Electric agreed to acquire approximately 90% of
  AiDASH at an implied enterprise value of USD 350 million, pending regulatory close.'
